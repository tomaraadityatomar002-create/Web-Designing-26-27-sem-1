<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment-18</title>
    <style>
        h1{
            background-color: blue;
        }
        #red{
            background-color: blue;

    </style>
</head>
<body>
    <h1 align="center"><b>ABC College Admission 2026</b></h1>
    <hr>
             <h2>Courses and Fees</h2>
             <table table border="1" align="center">
                <caption>Available Courses</caption>
                <tr>
                    <td>Courses</td>
                    <td>Seats</td>
                    <td>Fees</td>
                </tr>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>&#8377;90,000</td>
                </tr>
                <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>&#8377;45,000</td>
                </tr>
             </table>
              <fieldset>
                <legend>Application Form</legend>
             
             <form>
                <div>
                    <label>Name</label>
                    <br>
                    <input type="Text" required>
                </div>
                <br>
                <div>
                    <label>Email:</label>
                    <br>
                    <input type="E-mail" required>
                </div>
                <br>
                <div>
                    <label>Courses</label>
                    <br>
                    <select>
                        <option>B.Tech CSE</option>
                        <option>B.Tech CS</option>
                        <option>M.E</option>
                        <option>ECE</option>
                    </select>
                </div>
                <br>
                <div>
                    <label>Statement</label>
                    <br>
                    <textarea rows="5" columns="500"></textarea>
                </div>
                <br>
                <div>
                    <button type="button">Apply</button>
                </div>
             </form>
            </fieldset>
             <p align="center" id="red">&copy; 2026 ABC College</p>
</body>
