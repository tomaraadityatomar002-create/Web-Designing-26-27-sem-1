<html>
<head>
    <title>Experiment 4</title>
</head>
        <h1 align="center">Student Registration Form</h1>
        <hr>
         <form>
        <div>
             <label for="Full Name">Full Name:</label>
        <input type="text" required placeholder="Enter Your Full Name" id="Full Name">
        </div>
        <br>
        <div>
                    <label for="E-mail">E-mail:</label>
            <input type="E-mail" placeholder="Enter a valid email address" id="E-mail">
            </div>
            <br>
            <div>
            <label for="Password">Password</label>
            <input type="Password:" placeholder="Enter Password" id="Password">
            </div>
            <br>
            <div>
        <label>Gender:</label>
            <input type="radio" value="Male" id="Male" name="Gender" >
            <label for="Male">Male</label>
            <input type="radio" value="Female" id="Female" name="Gender">
            <label for="Female">Female</label>
            <input type="radio" value="Other" id="Other" name="Gender">
            <label for="Other">Other</label>
            </div>
            <br>
            <div>
            <label>Course:</label>
                <select>
            <option>--Select Course--</option>
            <option>B-TECH</option>
            <option>M-TECH</option>
            <option>BSC</option>
            <option>BCA</option>
            <option>MBA</option>
                </select>
                </div>
                <br>
                <div>
               <label for="Contact No">Contact No:</label>
            <input type=" Phone Number" placeholder="Enter phone number" id="Contact No">
             </div>
             <br>
        <div>
        <label for="Address>Address</label>
        <br>
        <textarea placeholder="Enter your address" rows="5" cols="50" id="Address"></textarea>
         </div>
         <br>
         <div>
       <input type="submit" value="Register">
       <input type="submit" value="Clear">
       </div>
       <hr>
       <p align="center">&copy;2025 Student Registration Portal</p>
        </form>



    </body>
</html>
